services:
  - type: web
    name: duodot
    runtime: docker
    plan: free
    region: frankfurt

    envVars:
      # Spring
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Server Port
      - key: PORT
        value: 8080

      # Database
      - key: DB_URL
        fromDatabase:
          name: duodot-db
          property: connectionString

      - key: DB_USERNAME
        fromDatabase:
          name: duodot-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: duodot-db
          property: password

      # Redis
      - key: REDIS_HOST
        fromService:
          type: redis
          name: duodot-redis
          property: host

      - key: REDIS_PORT
        fromService:
          type: redis
          name: duodot-redis
          property: port

      # JWT
      - key: JWT_SECRET
        generateValue: true

      - key: RESEND_API_KEY
        sync: false

      - key: NOTIFICATION_EMAIL_FROM
        sync: false

    healthCheckPath: /actuator/health
    autoDeploy: true

  - type: redis
    name: duodot-redis
    plan: free
    ipAllowList: []

databases:
  - name: duodot-db
    databaseName: duodot
    user: duodot
    plan: free
    region: oregon