services:
  - type: web
    name: duodot
    runtime: docker
    plan: free
    region: frankfurt

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Database
      - key: DB_HOST
        fromDatabase:
          name: duodot-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: duodot-db
          property: port

      - key: DB_DATABASE
        fromDatabase:
          name: duodot-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: duodot-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: duodot-db
          property: password

      # Redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: duodot-redis
          property: connectionString

      # RabbitMQ (internal private service)
      - key: RABBITMQ_HOST
        fromService:
          type: pserv
          name: duodot-rabbitmq
          property: host

      - key: RABBITMQ_PORT
        value: "5672"

      - key: RABBITMQ_USERNAME
        value: duodot

      - key: RABBITMQ_PASSWORD
        sync: false  # set in Render dashboard; must match RABBITMQ_DEFAULT_PASS on duodot-rabbitmq

      # Firebase — set FIREBASE_CREDENTIALS_JSON_BASE64 in Render dashboard
      # Generate with: base64 -i firebase-service-account.json | tr -d '\n'
      - key: FIREBASE_CREDENTIALS_JSON_BASE64
        sync: false

      # File uploads (ephemeral on free tier — files lost on redeploy)
      - key: FILE_UPLOAD_DIR
        value: /tmp/uploads

      # Secrets
      - key: JWT_SECRET
        generateValue: true

      - key: RESEND_API_KEY
        sync: false

      - key: NOTIFICATION_EMAIL_FROM
        sync: false

    autoDeploy: true

  # RabbitMQ private service — not accessible from the internet
  - type: pserv
    name: duodot-rabbitmq
    runtime: docker
    plan: free
    region: frankfurt
    image:
      url: docker.io/library/rabbitmq:3-alpine
    envVars:
      - key: RABBITMQ_DEFAULT_USER
        value: duodot
      - key: RABBITMQ_DEFAULT_PASS
        sync: false  # set in Render dashboard; must match RABBITMQ_PASSWORD on duodot web service

  - type: redis
    name: duodot-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: duodot-db
    databaseName: duodot
    user: duodot
    plan: free
    region: frankfurt