services:
  - type: web
    name: duodot
    runtime: docker
    plan: free
    region: frankfurt

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Database (pass components individually; build JDBC URL in Spring config)
      - key: DB_HOST
        fromDatabase:
          name: duodot-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: duodot-db
          property: port

      - key: DB_DATABASE
        fromDatabase:
          name: duodot-db
          property: database

      - key: DB_USERNAME
        fromDatabase:
          name: duodot-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: duodot-db
          property: password

      # Redis
      - key: REDIS_HOST
        fromService:
          type: redis
          name: duodot-redis
          property: host

      - key: REDIS_PORT
        fromService:
          type: redis
          name: duodot-redis
          property: port

      # Secrets
      - key: JWT_SECRET
        generateValue: true

      - key: RESEND_API_KEY
        sync: false

      - key: NOTIFICATION_EMAIL_FROM
        sync: false

    autoDeploy: true

  - type: redis
    name: duodot-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: duodot-db
    databaseName: duodot
    user: duodot
    plan: free
    region: frankfurt