spring:
  application:
    name: duo-dot-app

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duodot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
      # ❌ Don't use ${JPA_DDL_AUTO:update} in production
      # Use migrations or set to "update" for dev only
    show-sql: false  # ❌ Disable in production
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2KB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # Keep empty string default
      timeout: 2s

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: 86400000 # 24 hours
      refresh-token-expiration: 604800000 # 7 days
    otp:
      validity-minutes: 5
      length: 6

  file:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}

  notification:
    email:
      from: ${NOTIFICATION_EMAIL_FROM:noreply@example.com}
      resend:
        api-key: ${RESEND_API_KEY:}
        url: https://api.resend.com/emails

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  error:
    include-message: always

# ✅ Actuator settings for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
